<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="referrer" content="no-referrer"/>
<meta name="theme-color" content="#185FA5"/>
<title>מעקב הזמנות</title>
<link rel="icon" href="icon-192.png"/>
<style>
/* 📦 דף מעקב הזמנות ללקוח (10/10/2026). כניסה עם קישור במייל (Firebase Email Link), פעם אחת למכשיר.
   הנתונים מ-Cloud Function customerTrack, שבודקת שהמייל המאומת מורשה ללקוח — ראה functions/index.js */
:root{--bg:#f5f5f3;--card:#fff;--txt:#1c1c1a;--txt2:#555;--txt3:#888;--brd:rgba(0,0,0,.1);
  --blue:#185FA5;--blue-bg:#e6f0fa;--green:#16a34a;--green-bg:#dcfce7;--track:#e5e5e2}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--card:#252523;--txt:#f0f0ee;--txt2:#bbb;--txt3:#888;
  --brd:rgba(255,255,255,.12);--blue:#6aa8e8;--blue-bg:#1d3047;--green:#4ade80;--green-bg:#173a24;--track:#3a3a37}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header .logo{font-size:28px}
h1{font-size:20px;margin:0}
.sub{font-size:13px;color:var(--txt3)}
h2{font-size:14px;color:var(--txt2);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nm{font-weight:700;font-size:15px}
.meta{font-size:12px;color:var(--txt3);margin-top:2px}
.badge{flex:0 0 auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--blue-bg);color:var(--blue);white-space:nowrap}
.badge.done{background:var(--green-bg);color:var(--green)}
.bar{display:flex;gap:3px;margin:10px 0 4px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--track)}
.bar i.on{background:var(--blue)}
.bar.done i{background:var(--green)}
.pct{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:6px}
.pct b{display:block;height:100%;background:var(--blue)}
.stage{font-size:12px;color:var(--txt2)}
.msg{text-align:center;color:var(--txt3);padding:40px 10px;font-size:14px}
footer{font-size:11px;color:var(--txt3);text-align:center;margin:20px 0 8px}
footer button{background:none;border:0;color:var(--blue);font:inherit;cursor:pointer;text-decoration:underline;padding:0}
.login{max-width:380px;margin:30px auto;text-align:center}
.login p{font-size:14px;color:var(--txt2);margin:0 0 14px}
.login input{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--txt);text-align:left}
.login button{width:100%;margin-top:10px;font-size:16px;font-weight:700;padding:12px;border-radius:10px;border:0;background:var(--blue);color:#fff;cursor:pointer}
.login button:disabled{opacity:.6}
.login .err{color:#dc2626;font-size:13px;margin-top:8px;min-height:1em}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="logo">✂️</span><div><h1 id="ttl">מעקב הזמנות</h1><div class="sub" id="sub"></div></div></header>
  <div id="app"><div class="msg">⏳ טוען…</div></div>
  <footer id="ft"></footer>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,sendSignInLinkToEmail,isSignInWithEmailLink,signInWithEmailLink,signOut}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
// אותו פרויקט כמו index.html. ⚠️ **שם אפליקציה נפרד ('track') בכוונה:** ההתחברות נשמרת לפי שם האפליקציה,
// ובלעדיו כניסת לקוח באותו דפדפן הייתה דורסת את הכניסה של המנהל/עובד לאפליקציה (אותו origin)
const app0=initializeApp({apiKey:"AIzaSyCN9AlUZFX6tODyClzopC9BrRi-Oj7oSv8",projectId:"textileops-aef4a",appId:"1:570030273525:web:ff4a7d125a40066a4826bc",authDomain:"textileops-aef4a.firebaseapp.com"},'track');
const auth=getAuth(app0);auth.languageCode='he';
// ⚠️ השמות והסדר חייבים להתאים ל-TRACK_LISTS ב-functions/index.js (= PIPE_LISTS בלוח מצב הזמנות)
const STAGES=['ההזמנה התקבלה','בספירה וגזירה','ממתין לתפירה','בתפירה','התפירה הסתיימה','באריזה','מוכן למשלוח','נשלח'];
const URL_FN='https://us-central1-textileops-aef4a.cloudfunctions.net/customerTrack';
const PAGE=location.origin+location.pathname;
const LS_MAIL='trk_email';
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtD=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?m[3]+'/'+m[2]+'/'+m[1]:'';};
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const $=id=>document.getElementById(id);
const appEl=$('app'),ft=$('ft');
let busy=false;

function card(o){
  const last=STAGES.length-1,done=o.stage===last;
  const pct=o.stage===3?o.sewPct:o.stage===5?o.packPct:null;
  const no=o.no?'הזמנה #'+String(o.no).padStart(3,'0')+' · ':'';
  const segs=STAGES.map((_,i)=>`<i class="${i<=o.stage?'on':''}"></i>`).join('');
  return `<div class="card">
    <div class="top"><div><div class="nm">${esc(o.name||('דגם '+o.prod))}</div>
      <div class="meta">${no}${o.qty?o.qty+" יח' · ":''}${done?'נשלח '+fmtD(o.ship):'התקבל '+fmtD(o.entry)}</div></div>
      <span class="badge ${done?'done':''}">${esc(STAGES[o.stage]||'')}${pct!=null?' '+pct+'%':''}</span></div>
    <div class="bar ${done?'done':''}">${segs}</div>
    <div class="stage">שלב ${o.stage+1} מתוך ${STAGES.length}</div>
    ${pct!=null?`<div class="pct" title="${pct}%"><b style="width:${Math.max(0,Math.min(100,pct))}%"></b></div>`:''}
  </div>`;
}
const outBtn=()=>'<button id="out">התנתקות</button>';
const bindOut=()=>{const b=$('out');if(b)b.onclick=()=>signOut(auth);};

// ── מסך כניסה: מייל ← קישור למייל ──
function showLogin(msg,confirmMode){
  ft.textContent='';$('sub').textContent='';
  appEl.innerHTML=`<div class="login"><p>${msg||'הזינו את כתובת המייל שלכם ונשלח אליה קישור כניסה.<br>הכניסה נדרשת פעם אחת בכל מכשיר.'}</p>
    <form id="lf"><input type="email" id="em" dir="ltr" autocomplete="email" required placeholder="name@example.com" value="${esc(ls.get(LS_MAIL))}"/>
    <button id="lb">${confirmMode?'כניסה':'שלחו לי קישור כניסה'}</button><div class="err" id="er"></div></form></div>`;
  $('lf').onsubmit=async e=>{
    e.preventDefault();
    const em=$('em').value.trim().toLowerCase(),b=$('lb');
    if(!em)return;
    b.disabled=true;$('er').textContent='';
    try{
      if(confirmMode){await finishLink(em);return;}
      await sendSignInLinkToEmail(auth,em,{url:PAGE,handleCodeInApp:true});
      ls.set(LS_MAIL,em);
      appEl.innerHTML=`<div class="login"><p>📧 שלחנו קישור כניסה אל<br><b dir="ltr">${esc(em)}</b></p>
        <p>פתחו את המייל ולחצו על הקישור. לא הגיע? בדקו בתיקיית הספאם.</p></div>`;
    }catch(err){
      b.disabled=false;
      $('er').textContent=/invalid-email/.test(err.code)?'כתובת המייל אינה תקינה':
        /too-many|quota/.test(err.code)?'יותר מדי ניסיונות. נסו שוב מאוחר יותר.':'השליחה נכשלה. נסו שוב.';
    }
  };
}
// חזרה מהקישור שבמייל. במכשיר אחר אין את המייל השמור ⇒ מבקשים להקליד אותו שוב (דרישת Firebase)
async function finishLink(em){
  try{
    await signInWithEmailLink(auth,em,location.href);
    ls.set(LS_MAIL,em);
    history.replaceState(null,'',PAGE);
  }catch(err){
    history.replaceState(null,'',PAGE);
    showLogin(/invalid-email/.test(err.code)?'המייל שהוזן לא תואם לקישור. הזינו את המייל שאליו נשלח הקישור, או בקשו קישור חדש.':
      'הקישור פג תוקף או כבר נוצל. בקשו קישור חדש.');
  }
}

async function load(){
  const u=auth.currentUser;if(!u||busy)return;
  busy=true;
  try{
    const r=await fetch(URL_FN,{cache:'no-store',headers:{Authorization:'Bearer '+await u.getIdToken()}});
    if(r.status===401){await signOut(auth);return;}
    if(r.status===403){
      $('sub').textContent='';
      appEl.innerHTML=`<div class="msg">🔒 המייל <b dir="ltr">${esc(u.email)}</b> אינו מורשה לצפות בהזמנות.<br>פנו אלינו כדי להוסיף אותו.</div>`;
      ft.innerHTML=outBtn();bindOut();return;
    }
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();
    if(d.name){$('sub').textContent=d.name;document.title='מעקב הזמנות — '+d.name;}
    const act=d.orders.filter(o=>o.stage<STAGES.length-1),shp=d.orders.filter(o=>o.stage===STAGES.length-1);
    appEl.innerHTML=!d.orders.length?'<div class="msg">אין כרגע הזמנות פעילות.</div>':
      (act.length?`<h2>🏭 בייצור (${act.length})</h2>`+act.map(card).join(''):'')+
      (shp.length?`<h2>✅ נשלחו ב-30 הימים האחרונים (${shp.length})</h2>`+shp.map(card).join(''):'');
    const t=new Date(d.at);
    ft.innerHTML=esc(u.email)+' · עודכן '+t.toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · '+outBtn();
    bindOut();
  }catch(e){
    if(!appEl.querySelector('.card'))appEl.innerHTML='<div class="msg">⚠️ לא ניתן לטעון כרגע. נסו שוב בעוד רגע.</div>';
  }finally{busy=false;}
}

let confirmPending=false; // מכשיר אחר — מחכים שהלקוח יקליד את המייל; האזנת ה-auth לא תדרוס את הטופס
async function start(){
  if(isSignInWithEmailLink(auth,location.href)){
    appEl.innerHTML='<div class="msg">⏳ מתחבר…</div>';
    const em=ls.get(LS_MAIL);
    if(em)await finishLink(em);
    else{confirmPending=true;showLogin('לאישור הכניסה, הזינו שוב את כתובת המייל שאליה נשלח הקישור.',true);}
  }
  onAuthStateChanged(auth,u=>{
    if(u){confirmPending=false;appEl.innerHTML='<div class="msg">⏳ טוען…</div>';load();}
    else if(!confirmPending&&!appEl.querySelector('.login'))showLogin();
  });
}
start();
setInterval(()=>{if(!document.hidden)load();},5*60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
</script>
</body>
</html>
