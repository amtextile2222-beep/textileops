<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="referrer" content="no-referrer"/>
<meta name="theme-color" content="#2D6470"/>
<title>מעקב הזמנות</title>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<meta name="apple-mobile-web-app-title" content="מעקב הזמנות"/>
<style>
/* 📦 דף מעקב הזמנות ללקוח (10/10/2026). כניסה עם קישור במייל (Firebase Email Link), פעם אחת למכשיר.
   הנתונים מ-Cloud Function customerTrack, שבודקת שהמייל המאומת מורשה ללקוח — ראה functions/index.js */
/* 🎨 (03/11/2026) אותה ערכה כמו באפליקציה: תכלת (טקסט/פסים בגוון הכהה) + כתום לכפתורים */
:root{--bg:#e8f0f0;--card:#fff;--acc:#F45B0B;--acc-h:#d94c06;--sh:0 1px 2px rgba(20,50,58,.06),0 4px 16px rgba(20,50,58,.06);--txt:#1c1c1a;--txt2:#555;--txt3:#888;--brd:rgba(0,0,0,.1);
  --blue:#2D6470;--blue-bg:#dae8eb;--green:#16a34a;--green-bg:#dcfce7;--track:#e5e5e2;--red:#dc2626;--red-bg:#fee2e2}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--card:#252523;--txt:#f0f0ee;--txt2:#bbb;--txt3:#888;
  --brd:rgba(255,255,255,.12);--blue:#A8C9C8;--blue-bg:#1f3a39;--sh:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);--green:#4ade80;--green-bg:#173a24;--track:#3a3a37;--red:#f87171;--red-bg:#3f1d1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header .logo{font-size:28px}
#asx{margin-inline-start:auto;font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--txt);cursor:pointer}
h1{font-size:20px;margin:0}
.sub{font-size:13px;color:var(--txt3)}
h2{font-size:15px;color:var(--txt);margin:22px 0 10px;scroll-margin-top:12px}
/* 🎨 (15/11/2026) ליטוש: יותר אוויר, טקסט גדול יותר בטלפון, פס שלבים עבה יותר */
.card{background:var(--card);border:1px solid var(--brd);border-radius:18px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh);scroll-margin-top:12px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.nm{font-weight:700;font-size:16px;line-height:1.35}
.meta{font-size:13px;color:var(--txt3);margin-top:3px}
/* 📊 סיכום בראש הדף (15/11/2026) — 4 מספרים; לחיצה ⇒ גלילה לחלק שלו */
.sumg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
@media (max-width:560px){.sumg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sumt{display:block;text-align:right;padding:10px 12px;border-radius:14px;border:1px solid var(--brd);background:var(--card);color:var(--txt);font:inherit;cursor:pointer;box-shadow:var(--sh)}
.sumt span{display:block;font-size:12px;color:var(--txt3)}
.sumt b{display:block;font-size:24px;line-height:1.2;margin-top:2px}
.sumt.blue b{color:var(--blue)}.sumt.red b{color:var(--red)}.sumt.acc b{color:var(--acc)}.sumt.ok b{color:var(--green)}
.sumt.zero{cursor:default;box-shadow:none}.sumt.zero b{color:var(--txt3)}
.hl{animation:hl 1.4s ease-out}@keyframes hl{0%{box-shadow:0 0 0 3px var(--acc)}100%{box-shadow:0 0 0 0 transparent}}
.badge{flex:0 0 auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--blue-bg);color:var(--blue);white-space:nowrap;border:1px solid color-mix(in srgb,currentColor 22%,transparent)}
.badge.done{background:var(--green-bg);color:var(--green)}
.bar{display:flex;gap:4px;margin:14px 0 6px}
.bar span{flex:1;min-width:0;text-align:center}
.bar i{display:block;height:8px;border-radius:4px;background:var(--track)}
.bar .on i{background:var(--blue)}
.bar.done i{background:var(--green)}
.bar em{display:block;font-style:normal;font-size:11px;line-height:1.25;margin-top:5px;color:var(--txt3)}
.bar .on em{color:var(--txt2)}
.bar .cur em{color:var(--blue);font-weight:700}
.bar.done em{color:var(--txt2);font-weight:400}
.bar small{display:block;font-size:9px;line-height:1.2;color:var(--txt3);direction:ltr}
/* 🎨 (25/10/2026) שלב שהסתיים — ירוק · השלב הנוכחי — כחול · שלב עם חוסר פתוח — אדום (גם שלב עתידי) */
.bar .ok i{background:var(--green)}
.bar .ok em{color:var(--txt2)}
.bar .bad i{background:var(--red)}
.bar .bad em{color:var(--red);font-weight:700}
.short{font-size:13px;margin-top:6px;padding:7px 10px;border-radius:10px;background:var(--red-bg);color:var(--red)}
.short.res{background:none;color:var(--txt3);padding:2px 8px}
@media (max-width:420px){.bar{gap:2px}.bar em{font-size:9px}}
.pct{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:6px}
.pct b{display:block;height:100%;background:var(--blue)}
.stage{font-size:13px;color:var(--txt2);margin-top:2px}
.msg{text-align:center;color:var(--txt3);padding:40px 10px;font-size:14px}
/* 📦 מלאי חומר האריזה (23/10/2026): במסך רחב — עמודה צרה משמאל לצד ההזמנות (נשארת גלויה בגלילה);
   בטלפון — למעלה, לפני ההזמנות. בלי מלאי הדף נשאר בעמודה אחת ברוחב הרגיל */
.wrap.wide{max-width:1000px}
/* 🔔 התראות Push (23/10/2026) */
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--txt2);background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:9px 12px;margin-bottom:12px}
.pbar.on{background:var(--green-bg);color:var(--green);border-color:transparent}
.pbar span{font-size:12px;color:var(--txt3)}
.pbar .pbtn{font-size:14px;font-weight:700;padding:8px 14px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.pbar .pbtn:disabled{opacity:.6}
.pbar #poff{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:0}
/* 📦 (02/11/2026) שורת חומר: שם בשורה מלאה, מתחת — במפעל / נדרש / חסר; פריט לפי מידה = טבלה אחת */
.stk{padding:7px 0;border-top:1px solid var(--brd)}
.stk-d+.stk{border-top:0}
.stk-d{font-size:12px;font-weight:700;color:var(--txt2);margin:10px 0 2px}
.stk-n{font-size:13px;font-weight:600}
.stk-q{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--txt3);margin-top:2px}
.stk-q b{color:var(--txt);font-size:14px}
.stk.bad .stk-n{color:var(--red)}
.stk-miss{color:var(--red);font-weight:700}
.stk-ok{color:var(--green)}
.stk-t{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.stk-t th{font-weight:400;color:var(--txt3);text-align:right;padding:2px 4px}
.stk-t td{padding:3px 4px;border-top:1px solid var(--brd)}
.stk-t tr.bad td{color:var(--red);font-weight:700}
.stk-sum{font-size:12px;font-weight:700;padding:6px 8px;border-radius:8px;margin-bottom:4px;background:var(--red-bg);color:var(--red)}
.stk-sum.ok{background:var(--green-bg);color:var(--green)}
/* 🖨 ריכוז חוסרים (11/11/2026) — רשימה בראש חלון המלאי + הדפסה (דף נקי: רק #stkpr) */
.stk-sh{display:flex;align-items:center;gap:8px}
.stk-sh button{margin-inline-start:auto;white-space:nowrap;flex:0 0 auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;border:0;background:var(--red);color:#fff;cursor:pointer}
.stk-sl{margin:6px 0 0;padding:0 18px 0 0;font-weight:400}
.stk-sl li{margin:2px 0}
.stk-sl b{font-weight:700}
.ord-sum{margin-bottom:12px;font-size:13px;padding:10px 12px}
/* 👕 דגמים שמחכים לאישור — בראש הדף (15/11/2026) */
.smp-top{background:var(--blue-bg);color:var(--blue);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13px;box-shadow:var(--sh)}
.smp-top h3{margin:0 0 6px;font-size:15px}
.smp-go{display:block;width:100%;text-align:right;margin-top:6px;padding:8px 10px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--txt);font:inherit;font-size:13px;cursor:pointer}
.smp-go small{display:block;color:var(--txt3);font-size:12px;margin-top:2px}
.smp-go em{font-style:normal;color:var(--acc);font-weight:700}
#frsh{font:inherit;font-size:13px;font-weight:700;padding:4px 10px;border-radius:8px;border:1px solid var(--brd);background:var(--card);color:var(--txt);cursor:pointer;margin-inline-start:6px}
/* .stkpdf = עיצוב הדף המודפס — גם ב-@media print (#stkpr) וגם בצילום ל-PDF באייפון */
.stkpdf{color:#000;background:#fff;font-size:13px;padding:12mm;direction:rtl}
.stkpdf h3{margin:0 0 2px;font-size:18px}.stkpdf .d{color:#555;margin-bottom:10px}
.stkpdf table{width:100%;border-collapse:collapse}.stkpdf th,.stkpdf td{border:1px solid #999;padding:5px 7px;text-align:right}
.stkpdf th{background:#eee}.stkpdf td.x{font-weight:700}
#stkpr{display:none}
@media print{body>*:not(#stkpr){display:none!important}#stkpr{display:block!important}
  body{background:#fff!important;margin:0!important}@page{margin:0}}
.lay.has-stk{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.lay.has-stk aside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain}
@media (max-width:760px){.lay.has-stk{display:flex;flex-direction:column;gap:0}.lay.has-stk aside{order:-1;position:static;max-height:none;overflow:visible}}
/* ✂️ דוח גזירה (08/11/2026): שורה בכרטיס ⇒ חלון עם הדוח (iframe) והדפסה */
.cutb{display:flex;align-items:center;width:100%;margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--brd);background:var(--blue-bg);color:var(--blue);font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:right}
.cutb span{margin-right:auto;font-size:16px}
/* 👕 דגם לאישור (15/11/2026) */
.smp{margin-top:8px;padding:8px 10px;border-radius:10px;background:var(--blue-bg);color:var(--blue);font-size:13px}
.smp.ok{background:var(--green-bg);color:var(--green)}
.smp.no{background:var(--red-bg);color:var(--red)}
.smp-w{font-size:12px;margin:4px 0;padding:6px 9px;border-radius:8px;background:var(--red-bg);color:var(--red)}
.smpbr{display:flex;gap:8px}.smpbr .smpb{flex:1}
.smpb.rej{background:var(--card);color:var(--red);border:1px solid var(--red)}
.smp-l{font-size:12px;margin-top:2px}
.smp-t{font-size:13px;margin:3px 0 4px;padding:6px 9px;border-radius:8px;background:var(--card);color:var(--txt);white-space:pre-wrap}
.smpb{margin-top:7px;width:100%;padding:9px 12px;border-radius:10px;border:0;background:var(--acc);color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.smpb:disabled{opacity:.6;cursor:default}
.cutm{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:10px;z-index:50}
.cutm-b{background:var(--card);border-radius:14px;width:100%;max-width:900px;height:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.cutm-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--brd);font-size:14px}
.cutm-h button{font:inherit;font-size:14px;padding:6px 12px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--txt);cursor:pointer}
.cutm-h #cutp{background:var(--acc);color:#fff;border:0;font-weight:700}
.cutm-h #cutp:disabled{opacity:.5}
#cutc{flex:1;display:flex}
.cutf{flex:1;width:100%;border:0;background:#fff}
/* 🖼 תמונות (08/11/2026) */
.thumb{flex:0 0 auto;width:64px;height:64px;object-fit:cover;border-radius:12px;border:1px solid var(--brd);background:var(--track);cursor:zoom-in}
.sthumb{float:left;width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--brd);margin:0 0 4px 8px;cursor:zoom-in}
.stk::after{content:"";display:block;clear:both}
.imgm-b{max-width:95vw;max-height:92vh;text-align:center;color:#fff;font-size:14px}
.imgm-b img{display:block;max-width:95vw;max-height:85vh;border-radius:12px;margin:0 auto 8px;background:#fff}
footer{font-size:11px;color:var(--txt3);text-align:center;margin:20px 0 8px}
footer button{background:none;border:0;color:var(--blue);font:inherit;cursor:pointer;text-decoration:underline;padding:0}
.login{max-width:380px;margin:30px auto;text-align:center}
.login p{font-size:14px;color:var(--txt2);margin:0 0 14px}
.login input{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--txt);text-align:left}
.login button{width:100%;margin-top:10px;font-size:16px;font-weight:700;padding:12px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.login button:hover:not(:disabled),.pbar .pbtn:hover:not(:disabled){background:var(--acc-h)}
.login input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
h1{color:var(--blue)}
.pbar{box-shadow:var(--sh)}
.login button:disabled{opacity:.6}
.login .err{color:#dc2626;font-size:13px;margin-top:8px;min-height:1em}
/* ♿ (16/11/2026) ליטוש לפי כללי UI UX Pro Max — נגישות ומגע, בלי לשנות את המבנה:
   · ניגודיות: טקסט משני #888 על לבן = 3.5:1 (מתחת ל-4.5:1) ⇒ כהה יותר; בכהה — בהיר יותר
   · כפתורים בגובה 44px לפחות (אצבע), טבעת פוקוס במקלדת, תגובה במעבר עכבר/לחיצה (150ms)
   · מספרים ברוחב קבוע (טבלאות, אריחים) · טקסט שלבים בטלפון לא קטן מ-10px · prefers-reduced-motion */
:root{--txt3:#6b6b68}
@media (prefers-color-scheme:dark){:root{--txt3:#a3a3a0}}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
button,.cutb,.smp-go,.sumt{-webkit-tap-highlight-color:transparent}
.sumt,.smp-go,.cutb,.smpb,.pbar .pbtn,.login button,#frsh,#asx,.cutm-h button,.stk-sh button{transition:background-color .15s,border-color .15s,box-shadow .15s,transform .1s}
@media (hover:hover){
  .sumt:not(.zero):hover,.smp-go:hover{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),var(--sh)}
  .cutb:hover{border-color:var(--blue)}
  .smpb:not(:disabled):not(.rej):hover{background:var(--acc-h)}
  .smpb.rej:hover{background:var(--red-bg)}
  #frsh:hover,#asx:hover,.cutm-h button:not(#cutp):hover{border-color:var(--blue)}
  .thumb:hover,.sthumb:hover{box-shadow:0 0 0 2px var(--blue)}}
.sumt:not(.zero):active,.smp-go:active,.cutb:active,.smpb:not(:disabled):active{transform:scale(.98)}
.smpb,.cutb,.smp-go,.login button,.pbar .pbtn{min-height:44px}
#frsh,#asx,.cutm-h button,.stk-sh button{min-height:36px}
.sumt b,.stk-t td,.stk-q b,.badge,.bar small{font-variant-numeric:tabular-nums}
.bar small{font-size:10px}
@media (max-width:420px){.bar em{font-size:10px}}
.short{line-height:1.4}
/* 🎨 (16/11/2026) עיצוב לפי UI UX Pro Max — קטגוריה Logistics/Delivery: Minimalism + Flat, כחול-ירקרק (בתהליך) /
   כתום (פעולה) / ירוק (נשלח), "Order status stepper" עם "Status pulse" לשלב הנוכחי */
:root{--brand:#2D6470;--brand-2:#3b7f8c}
header.brand{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-radius:18px;padding:14px 16px;margin:0 0 16px;box-shadow:var(--sh)}
header.brand h1{color:#fff;font-size:21px}
header.brand .sub{color:rgba(255,255,255,.82);font-size:14px}
header.brand .logo{width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,.16);font-size:24px}
header.brand #asx{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
/* פס שלבים = עיגולים מחוברים בקו. ✓ = הסתיים · מספר = עוד לא · ! = חוסר פתוח */
.bar{gap:0;margin:16px 0 8px}
.bar span{position:relative}
.bar span:not(:last-child)::after{content:"";position:absolute;top:11px;right:50%;width:100%;height:3px;background:var(--track);z-index:0}
.bar span.ok:not(:last-child)::after,.bar.done span:not(:last-child)::after{background:var(--green)}
.bar i{position:relative;z-index:1;width:24px;height:24px;margin:0 auto;border-radius:50%;background:var(--card);border:2px solid var(--track);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;color:var(--txt3);line-height:1;font-variant-numeric:tabular-nums}
.bar .ok i,.bar.done i{background:var(--green);border-color:var(--green);color:#fff}
.bar .on i{background:var(--blue);border-color:var(--blue);color:#fff}
.bar .bad i{background:var(--red);border-color:var(--red);color:#fff}
.bar .cur:not(.bad) i{animation:pulse 2s ease-out infinite}
.bar.done .cur i{animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 45%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.bar em{margin-top:6px}
@media (max-width:420px){.bar i{width:20px;height:20px;font-size:10px}.bar span:not(:last-child)::after{top:9px}}
/* פס צבע בצד הכרטיס לפי המצב: בייצור · מחכה לאישורכם · חוסר פתוח · נשלח */
.card.st-act{border-inline-start:4px solid var(--blue)}
.card.st-smp{border-inline-start:4px solid var(--acc)}
.card.st-bad{border-inline-start:4px solid var(--red)}
.card.st-shp{border-inline-start:4px solid var(--green)}
@media (prefers-color-scheme:dark){header.brand{background:linear-gradient(135deg,#24525c,#2D6470)}}
/* אייקון בתוך טקסט — בגובה האות, בצבע הטקסט */
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:0 0 auto;display:inline-block}
header.brand .logo .ic{width:26px;height:26px;vertical-align:0}
h2 .ic{width:1.25em;height:1.25em;color:var(--blue)}
.msg .ic{width:1.3em;height:1.3em}
.cutb{gap:6px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

function card(o){
  const last=STAGES.length-1,done=o.stage===last;

  // ⚠ חוסרים (25/10/2026): פתוחים צובעים את השלב שלהם באדום; שלב שעבר — ירוק, הנוכחי — כחול
  const sh=Array.isArray(o.short)?o.short:[],openSt=new Set(sh.filter(x=>!x.res).map(x=>x.st));
  const segCls=i=>openSt.has(i)?'bad':!(i<=o.stage&&!(sp&&i===4))?'':(i<o.stage||done)?'ok':'on';

  const dm=ms=>{const d=new Date(+ms);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}; // תאריך מקומי

      <span class="badge ${done?'done':''}">${esc(STAGES[o.stage]||'')}${pct!=null?' '+pct+'%':''}</span></div>
    <div class="bar ${done?'done':''}">${segs}</div>
    <div class="stage">שלב ${o.stage+1} מתוך ${STAGES.length}</div>
    ${sp?`<div class="stage">בתפירה ${o.sewPct}%</div><div class="pct" title="${o.sewPct}%"><b style="width:${Math.max(0,Math.min(100,o.sewPct))}%"></b></div><div class="stage">באריזה ${pct??0}%</div>`:''}

// ✖ לא אושר (15/11/2026): o.sd = ההחלטה האחרונה {k,d,why}, o.so = מחכים להחלטה (שרת ישן — רק smpOk)

}
async function approveSmp(b){

  if(rej){why=(prompt('מה צריך לתקן בדגם של '+b.dataset.nm+'?\nההערה תישלח למפעל.')||'').trim();if(!why)return;}
  else if(!confirm('לאשר את הדגם של '+b.dataset.nm+'?\nהמפעל יקבל הודעה שהדגם אושר.'))return;
  b.disabled=true;b.innerHTML=ic('hg')+' שולח…';
  try{
    const r=await fetch(URL_FN,{method:'POST',cache:'no-store',headers:{Authorization:'Bearer '+await u.getIdToken(),'X-Dev':devId(),'Content-Type':'application/json'},body:JSON.stringify(rej?{reject:b.dataset.pid,why:why.slice(0,300)}:{approve:b.dataset.pid})});
    if(!r.ok)throw new Error(r.status);
    await load();
  }catch(e){b.disabled=false;b.innerHTML=lbl;alert('ההודעה לא נשלחה. נסו שוב בעוד רגע.');}
}
// 🍎 הדפסה באייפון (11/11/2026): ב-PWA במסך הבית window.print() לא עושה כלום ⇒ צילום (html2canvas) ⇒ PDF (jsPDF)
// ⇒ חלון השיתוף ⇒ "הדפסה". כמו _dnPdfBlob באפליקציה. navigator.share דורש לחיצה טרייה ⇒ הכנה בלחיצה הראשונה,
// והכפתור הופך ל"🖨 PDF מוכן — הדפסה" לשיתוף בלחיצה השנייה.
const _ldJs=(src,ok,sri)=>ok()?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');if(sri){sc.integrity=sri;sc.crossOrigin='anonymous';}sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error('טעינה נכשלה'));document.head.appendChild(sc);});
const _pdfB={}; // PDF מוכן לכל כפתור (stkp = מלאי, ordp = הזמנות)
async function stkPdf(html,bid='stkp'){
  const b=$(bid);let _stkBlob=_pdfB[bid];
  if(_stkBlob&&b?.dataset.ready){const f=new File([_stkBlob],(bid==='ordp'?'orders':'shortage')+'.pdf',{type:'application/pdf'});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}}catch(e){if(e?.name==='AbortError')return;}
    const u=URL.createObjectURL(_stkBlob);location.href=u;return;}
  if(b){b.disabled=true;b.innerHTML=ic('hg')+' מכין…';}
  try{
    await _ldJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',()=>window.html2canvas,'sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H');
    await _ldJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',()=>window.jspdf,'sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk');
    const el=document.createElement('div');el.className='stkpdf';el.style.cssText='position:fixed;left:-10000px;top:0;width:794px';el.innerHTML=html;document.body.appendChild(el);
    let cv;try{cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',windowWidth:794});}finally{el.remove();}
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),pagePx=Math.floor(cv.width*297/210);
    for(let y=0,pg=0;y<cv.height;y+=pagePx,pg++){const h=Math.min(pagePx,cv.height-y);if(pg&&h<pagePx*0.08)break;
      const c=document.createElement('canvas');c.width=cv.width;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,h);x.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      if(pg)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,h*210/cv.width);}
    _stkBlob=_pdfB[bid]=doc.output('blob');
    if(b){b.disabled=false;b.dataset.ready=1;b.innerHTML=ic('pr')+' PDF מוכן — הדפסה';}
  }catch(e){if(b){b.disabled=false;b.innerHTML=ic('pr')+' הדפסה';}alert('הכנת ה-PDF נכשלה: '+(e?.message||e));}
}
// ✂️ דוח גזירה (08/11/2026) — אותו דף שמודפס במפעל (cutPrints), נטען מהשרת רק בלחיצה. iframe בלי סקריפטים

// 🖼 תמונות (08/11/2026) — דגם בכרטיס, חומר במלאי. נטענות מהשרת (?img=) פעם אחת לכל מועד (v) ונשמרות בזיכרון,
// כך שהרענון כל דקה לא טוען שוב. לחיצה = הגדלה
const imgMem=new Map(),imgBusy=new Set();
// 🔒 (12/11/2026) התמונה מגיעה מ-thumbs — אוסף שעובדים כותבים אליו. מתקבלת רק תמונת data: תקינה, ובכל מקום
// שהיא נכנסת ל-HTML היא עוברת esc (ערך עם מירכאות היה סוגר את src ומוסיף onerror = הרצת קוד בדף)
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches; // ♿ בלי גלילה חלקה למי שביקש פחות תנועה
const IMG_OK=/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/;
function imgTag(id,v,cls,alt){
  if(!id||!v)return '';const k=id+'@'+v,src=imgMem.get(k);
  return `<img class="${cls}" tabindex="0" role="button" data-img="${esc(id)}" data-v="${esc(v)}" alt="${esc(alt||'')}"${src?` src="${esc(src)}"`:' style="visibility:hidden"'}>`;
}
async function loadImgs(){
  const u=(AS?mAuth:auth).currentUser;if(!u)return;
  for(const el of appEl.querySelectorAll('img[data-img]:not([src])')){
    const id=el.dataset.img,v=el.dataset.v,k=id+'@'+v;
    if(imgMem.has(k)){el.src=imgMem.get(k);el.style.visibility='';continue;}
    if(imgBusy.has(k))continue;imgBusy.add(k);
    try{const r=await fetch(URL_FN+'?img='+encodeURIComponent(id)+'&v='+encodeURIComponent(v)+(AS?'&cust='+encodeURIComponent(AS):''),{headers:{Authorization:'Bearer '+await u.getIdToken(),'X-Dev':devId()}});
      if(r.ok){const j=await r.json();if(j.img&&IMG_OK.test(j.img)){imgMem.set(k,j.img);appEl.querySelectorAll('img[data-img]').forEach(x=>{if(x.dataset.img===id&&x.dataset.v===v){x.src=j.img;x.style.visibility='';}});}}
      else if(r.status===404)appEl.querySelectorAll('img[data-img]').forEach(x=>{if(x.dataset.img===id)x.remove();});
    }catch(e){}finally{imgBusy.delete(k);}
  }
}

  // זום סביב נקודה במסך — הנקודה שמתחת לעכבר נשארת במקומה
  const zoomAt=(ns,px,py)=>{ns=Math.max(1,Math.min(8,ns));
    const r=img.getBoundingClientRect(),ox=r.left-x,oy=r.top-y,ix=(px-r.left)/s,iy=(py-r.top)/s;
    s=ns;if(s===1){x=0;y=0;}else{x=px-ox-ix*s;y=py-oy-iy*s;}apply();};
  const mid=()=>{const r=img.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];};
  const close=()=>{m.remove();document.removeEventListener('keydown',onKey);};
  const onKey=e=>{if(e.key==='Escape')close();else if(e.key==='+'||e.key==='=')zoomAt(s*1.4,...mid());else if(e.key==='-')zoomAt(s/1.4,...mid());};
  document.addEventListener('keydown',onKey);
  m.addEventListener('wheel',e=>{e.preventDefault();zoomAt(s*(e.deltaY<0?1.2:1/1.2),e.clientX,e.clientY);},{passive:false});
  img.addEventListener('dblclick',e=>{e.stopPropagation();zoomAt(s>1?1:2.5,e.clientX,e.clientY);});
  img.addEventListener('pointerdown',e=>{if(s<=1||e.pointerType==='touch')return;drag={sx:e.clientX-x,sy:e.clientY-y};moved=false;img.setPointerCapture(e.pointerId);apply();});
  img.addEventListener('pointermove',e=>{if(!drag)return;x=e.clientX-drag.sx;y=e.clientY-drag.sy;moved=true;apply();});
  img.addEventListener('pointerup',()=>{drag=null;apply();});
  img.addEventListener('click',e=>e.stopPropagation());
  m.querySelectorAll('[data-z]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const z=b.dataset.z;
    if(z==='close')close();else zoomAt(z==='in'?s*1.5:s/1.5,...mid());}));
  m.onclick=()=>{if(moved){moved=false;return;}close();};
  document.body.appendChild(m);
}

async function pushCall(method,body){

async function pushOk(){try{return 'Notification' in window&&'serviceWorker' in navigator&&await isSupported();}catch(e){return false;}}

async function pushUi(){

  const on=$('pon'),off=$('poff');
  if(on)on.onclick=pushOn;
  if(off)off.onclick=async()=>{off.disabled=true;try{await pushCall('POST',{off:true});pushSt.on=false;}catch(e){}pushUi();};

async function pushOn(){
  const b=$('pon');if(b){b.disabled=true;b.innerHTML=ic('hg')+' רגע…';}
  try{
    // requestPermission ישירות מהלחיצה — אחרת ספארי/אייפון דוחים את הבקשה
    if(await Notification.requestPermission()!=='granted'){await pushUi();return;}
    const reg=await navigator.serviceWorker.register('track-sw.js',{scope:'./track'});

}

function showLogin(msg,confirmMode){
  ft.textContent='';$('sub').textContent='';
  if(!msg&&reauthMsg){msg='מטעמי אבטחה יש להיכנס מחדש.<br>הזינו את המייל ונשלח קישור כניסה חדש.';reauthMsg=false;}
  appEl.innerHTML=`<div class="login"><p>${msg||'הזינו את כתובת המייל שלכם ונשלח אליה קישור כניסה.<br>הכניסה נדרשת פעם אחת בכל מכשיר.'}</p>
    <form id="lf"><input type="email" id="em" dir="ltr" autocomplete="email" required placeholder="name@example.com" value="${esc(ls.get(LS_MAIL))}"/>
    <button id="lb">${confirmMode?'כניסה':'שלחו לי קישור כניסה'}</button><div class="err" id="er"></div></form></div>`;
  $('lf').onsubmit=async e=>{
    e.preventDefault();
    const em=$('em').value.trim().toLowerCase(),b=$('lb');
    if(!em)return;
    b.disabled=true;$('er').textContent='';
    try{
      if(confirmMode){await finishLink(em);return;}
      await sendSignInLinkToEmail(auth,em,{url:PAGE,handleCodeInApp:true});
      ls.set(LS_MAIL,em);
      appEl.innerHTML=`<div class="login"><p>${ic('en')} שלחנו קישור כניסה אל<br><b dir="ltr">${esc(em)}</b></p>
        ${STANDALONE?`<p>פתחתם ממסך הבית? <b>אל תלחצו</b> על הקישור במייל — לחצו עליו לחיצה ארוכה ← <b>העתק</b>, והדביקו כאן:</p>
        <form id="pf"><input id="pl" dir="ltr" placeholder="https://…" autocomplete="off"/><button>כניסה</button><div class="err" id="per"></div></form>`
        :'<p>פתחו את המייל ולחצו על הקישור.</p>'}<p>לא הגיע? בדקו בתיקיית הספאם.</p></div>`;
      if(STANDALONE)$('pf').onsubmit=async ev=>{
        ev.preventDefault();const u=$('pl').value.trim();
        if(!isSignInWithEmailLink(auth,u)){$('per').textContent='זה לא קישור הכניסה מהמייל';return;}
        await finishLink(em,u);
      };
    }catch(err){
      b.disabled=false;
      $('er').textContent=/invalid-email/.test(err.code)?'כתובת המייל אינה תקינה':
        /too-many|quota/.test(err.code)?'יותר מדי ניסיונות. נסו שוב מאוחר יותר.':'השליחה נכשלה. נסו שוב.';
    }
  };
}

    const stk=Array.isArray(d.stock)?d.stock:[];

    const DEPT={cut:ic('sc')+' גזירה',sew:ic('nd')+' תפירה',pack:ic('pk')+' אריזה'},multi=new Set(stk.map(s=>s.dept||'pack')).size>1;
    // 📋 (25/10/2026) נדרש להזמנות שלכם שבמפעל וכמה חסר — מהשרת (need); בלי need — כמו קודם
    // 📋 (02/11/2026) נוסח ברור יותר: כל חומר — שם בשורה משלו ומתחתיו "במפעל / נדרש / חסר";
    // פריט לפי מידה (מפתח פריט|מידה) — טבלה אחת במקום שורה לכל מידה; למעלה — סיכום כמה חומרים כדאי לשלוח
    const r2=x=>Math.round(x*100)/100,unitOf=s=>s.unit&&s.unit!=="יח'"?' '+esc(s.unit):'';
    const stOf=s=>{const nd=Number(s.need)||0,n=Number(s.n)||0,miss=nd>0&&n<nd;return{nd,n,miss,bad:n<0||!!s.low||miss};};
    // (11/11/2026) שני דברים נפרדים: חסר להזמנות שבמפעל (נדרש−במפעל, או כמות שלילית) · השלמה למינימום (min−במפעל) — לא מערבבים
    const qOf=s=>{const{nd,n,miss}=stOf(s),mn=Number(s.min)||0;return{nq:miss?nd-n:n<0?-n:0,mq:s.low&&mn>n?mn-n:0,mn};};
    const qTxt=(s,u,sep)=>{const{nq,mq,mn}=qOf(s),a=[];if(nq>0)a.push(`<b>חסר ${r2(nq)}${u}</b> להזמנות`);if(mq>0)a.push(`<b>${r2(mq)}${u}</b> להשלמת המינימום (${r2(mn)}${u})`);else if(s.low)a.push('מתחת למינימום');return a.join(sep);};

    const stkList=l=>{const out=[],grp={};l.forEach(s=>{const m=String(s.k||'').includes('|')&&/^(.*) · מידה (.*)$/.exec(s.name||'');
        if(!m){out.push(s);return;}const b=String(s.k).split('|')[0];if(!grp[b]){grp[b]={name:m[1],l:[]};out.push(grp[b]);}grp[b].l.push({...s,sz:m[2]});});

    // 🖼 תמונת החומר (08/11/2026) — img = מועד; המזהה לפי הפריט (בלי מידה)
    const stkImg=s=>s.img&&s.imgId?imgTag(s.imgId,s.img,'sthumb',s.name):'';

    // כמות לשלוח = הגדול מבין: חסר לנדרש · חסר עד המינימום (min — מהשרת מ-11/11) · כמות שלילית
    const shortL=stk.filter(s=>stOf(s).bad).map(s=>{const{nd,n}=stOf(s),u=unitOf(s),{nq,mq,mn}=qOf(s);

    const shortHtml='<ul class="stk-sl">'+shortL.map(x=>`<li>${esc(x.s.name)}: ${qTxt(x.s,x.u,' · ')}</li>`).join('')+'</ul>';

      if(IOS){stkPdf(p.innerHTML);return;} // 🍎 באייפון (אפליקציה במסך הבית) window.print לא עושה כלום

    window._stkPrint=printShort;

    const fmtD=ms=>{const t=new Date(+ms);return String(t.getDate()).padStart(2,'0')+'/'+String(t.getMonth()+1).padStart(2,'0');};

    const ordHtml=ordShort.length?`<div class="stk-sum ord-sum" id="ord-sum"><div class="stk-sh">${ic('wa')} ${ordShort.length===1?'חוסר אחד':ordShort.length+' חוסרים'} בהזמנות בייצור<button id="ordp">${ic('pr')} הדפסה</button></div><ul class="stk-sl">`+

    window._ordPrint=()=>{let p=$('stkpr');if(!p){p=document.createElement('div');p.id='stkpr';p.className='stkpdf';document.body.appendChild(p);}
      const dt=new Date().toLocaleString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      p.innerHTML=`<h3>ריכוז חוסרים — הזמנות בייצור</h3><div class="d">${esc(d.name||'')} · ${dt}</div><table><tr><th>הזמנה</th><th>שלב</th><th>חוסר</th><th>מאז</th></tr>`+
        ordShort.map(({o,x})=>`<tr><td>${esc(oLbl(o))}</td><td>${esc(STAGES[x.st]||'')}</td><td class="x">${esc(x.txt)}</td><td>${fmtD(x.at)}</td></tr>`).join('')+'</table>';
      if(IOS){stkPdf(p.innerHTML,'ordp');return;}
      window.print();};
    const stkHtml=stk.length?`<h2 id="stk-box">${ic('pk')} החומרים שלכם במפעל</h2><div class="card">${nBad?`<div class="stk-sum"><div class="stk-sh">${ic('wa')} ${nBad===1?'חומר אחד':nBad+' חומרים'} — כדאי לשלוח עוד<button id="stkp">${ic('pr')} הדפסה</button></div>${shortHtml}</div>`:'<div class="stk-sum ok">✓ יש מספיק מכל החומרים</div>'}${multi
        ?Object.keys(DEPT).map(d=>{const l=stk.filter(s=>(s.dept||'pack')===d);return l.length?`<div class="stk-d">${DEPT[d]}</div>`+stkList(l):'';}).join('')
        :stkList(stk)}<div class="meta" style="margin-top:8px">מתעדכן אוטומטית עם כל משלוח שיוצא אליכם.</div></div>`:'';
    appEl.closest('.wrap')?.classList.toggle('wide',!!stk.length);
    // 📊 סיכום בראש הדף (15/11/2026): בייצור · מחכה לאישורכם · חוסרים · חומר לשלוח (בלי מלאי — נשלחו). 0 = אפור ובלי לחיצה
    const nSmp=d.orders.filter(o=>Array.isArray(o.smp)&&o.smp.length&&('so' in o?o.so:!o.smpOk)).length;
    const tile=(lbl,n,cls,go)=>`<button class="sumt ${n?cls:'zero'}"${n&&go?' data-sum="'+go+'"':''}><span>${lbl}</span><b>${n}</b></button>`;
    const sumHtml=d.orders.length?'<div class="sumg">'+tile('בייצור',act.length,'blue','h-act')+tile('מחכה לאישורכם',nSmp,'acc','smp-top')
      +tile('חוסרים בהזמנות',ordShort.length,'red','ord-sum')+(stk.length?tile('חומרים לשלוח',nBad,'red','stk-box'):tile('נשלחו (30 יום)',shp.length,'ok','h-shp'))+'</div>':'';
    appEl.innerHTML=sumHtml+`<div class="lay${stk.length?' has-stk':''}"><main>`+(!d.orders.length?'<div class="msg">אין כרגע הזמנות פעילות.</div>':
      smpTop(d.orders)+
      (act.length?`<h2 id="h-act">${ic('fa')} בייצור (${act.length})</h2>`+ordHtml+act.map(card).join(''):'')+
      (shp.length?`<h2 id="h-shp">${ic('cc')} נשלחו ב-30 הימים האחרונים (${shp.length})</h2>`+shp.map(card).join(''):''))+
      `</main>${stk.length?'<aside>'+stkHtml+'</aside>':''}</div>`;
    const sp=$('stkp');if(sp)sp.onclick=()=>window._stkPrint&&window._stkPrint();
    const op=$('ordp');if(op)op.onclick=()=>window._ordPrint&&window._ordPrint();
    loadImgs();
    const t=new Date(d.at);
    const upd=' · עודכן '+t.toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    if(AS){ft.innerHTML=ic('ey')+' תצוגת מנהל — כך הלקוח רואה את הדף'+upd+' <button id="frsh">'+ic('rf')+' רענן עכשיו</button>';
      $('frsh').onclick=async e=>{e.currentTarget.disabled=true;e.currentTarget.innerHTML=ic('hg')+' בונה…';await load(true);};return;}
    ft.innerHTML=esc(u.email)+upd+' · '+outBtn();
    bindOut();
    pushInit(); // 🔔 פעם אחת אחרי טעינה מוצלחת (pushSt שמור — לא קורא שוב לשרת בכל רענון)
  }catch(e){
    if(!appEl.querySelector('.card'))appEl.innerHTML='<div class="msg">'+ic('wa')+' לא ניתן לטעון כרגע. נסו שוב בעוד רגע.</div>';
  }finally{busy=false;}
}

let confirmPending=false; // מכשיר אחר — מחכים שהלקוח יקליד את המייל; האזנת ה-auth לא תדרוס את הטופס
async function start(){
  if(AS){
    onAuthStateChanged(mAuth,u=>{
      if(u){appEl.innerHTML='<div class="msg">'+ic('hg')+' טוען…</div>';load();}
      else appEl.innerHTML='<div class="msg">'+ic('lk')+' תצוגת לקוח זמינה למנהל בלבד.<br>היכנסו לאפליקציה כמנהל ופתחו שוב מחלון "פרטי לקוח".</div>';
    });
    return;
  }
  if(isSignInWithEmailLink(auth,location.href)){
    appEl.innerHTML='<div class="msg">'+ic('hg')+' מתחבר…</div>';
    const em=ls.get(LS_MAIL);
    if(em)await finishLink(em);
    else{confirmPending=true;showLogin('לאישור הכניסה, הזינו שוב את כתובת המייל שאליה נשלח הקישור.',true);}
  }
  onAuthStateChanged(auth,u=>{
    if(u){confirmPending=false;appEl.innerHTML='<div class="msg">'+ic('hg')+' טוען…</div>';load();}
    else if(!confirmPending&&!appEl.querySelector('.login'))showLogin();
  });
}
// 🔄 גרסה חדשה של הדף (22/10/2026) — דף שנשאר פתוח (לשונית/אפליקציה במחשב) מרענן את עצמו לבד.
// טביעה מכותרות HEAD כמו _verFingerprint ב-index.html: בסיס נפרד לכל סוג טביעה (רפליקות CDN שונות
// מחזירות ETag או לא — השוואה בין סוגים = רענון שווא). לא בזמן טופס כניסה (המייל שהוקלד היה נמחק)
const verBase={};
async function checkVer(){
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{method:'HEAD',cache:'no-store'});if(!r.ok)return;
    const et=(r.headers.get('etag')||'').replace(/^W\//,'').replace(/"/g,''),cl=r.headers.get('content-length');
    // ETag של Pages = "mtime-גודל"; כל דחיפה משנה mtime לכל הקבצים ⇒ משווים רק את הגודל (רענון רק כשהדף עצמו השתנה)
    const m=et.match(/^[0-9a-f]+-([0-9a-f]+)$/);
    const tag=m?{k:'et',v:parseInt(m[1],16)}:et?{k:'etx',v:et}:cl?{k:'cl',v:+cl}:null;if(!tag)return;
    if(!verBase[tag.k]){verBase[tag.k]=tag.v;return;}
    if(tag.v!==verBase[tag.k]&&!appEl.querySelector('.login'))location.reload();
  }catch(e){}
}
const tick=()=>{if(!document.hidden){load();checkVer();}};
start();checkVer();
// כל דקה (23/10/2026, היה 5) — רק כשהדף על המסך; ההזמנות עצמן שמורות בשרת 15 דק', המלאי מחושב בכל פעם
setInterval(tick,60000);
document.addEventListener('visibilitychange',tick);
</script>
