<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="referrer" content="no-referrer"/>
<meta name="theme-color" content="#2D6470"/>
<title>מעקב הזמנות</title>
<link rel="icon" href="icon-192.png"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<meta name="apple-mobile-web-app-title" content="מעקב הזמנות"/>
<style>
/* 📦 דף מעקב הזמנות ללקוח (10/10/2026). כניסה עם קישור במייל (Firebase Email Link), פעם אחת למכשיר.
   הנתונים מ-Cloud Function customerTrack, שבודקת שהמייל המאומת מורשה ללקוח — ראה functions/index.js */
/* 🎨 (03/11/2026) אותה ערכה כמו באפליקציה: תכלת (טקסט/פסים בגוון הכהה) + כתום לכפתורים */
:root{--bg:#e8f0f0;--card:#fff;--acc:#F45B0B;--acc-h:#d94c06;--sh:0 1px 2px rgba(20,50,58,.06),0 4px 16px rgba(20,50,58,.06);--txt:#1c1c1a;--txt2:#555;--txt3:#888;--brd:rgba(0,0,0,.1);
  --blue:#2D6470;--blue-bg:#dae8eb;--green:#16a34a;--green-bg:#dcfce7;--track:#e5e5e2;--red:#dc2626;--red-bg:#fee2e2}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1a;--card:#252523;--txt:#f0f0ee;--txt2:#bbb;--txt3:#888;
  --brd:rgba(255,255,255,.12);--blue:#A8C9C8;--blue-bg:#1f3a39;--sh:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);--green:#4ade80;--green-bg:#173a24;--track:#3a3a37;--red:#f87171;--red-bg:#3f1d1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
header .logo{font-size:28px}
#asx{margin-inline-start:auto;font-size:14px;font-weight:700;padding:8px 12px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--txt);cursor:pointer}
h1{font-size:20px;margin:0}
.sub{font-size:13px;color:var(--txt3)}
h2{font-size:14px;color:var(--txt2);margin:20px 0 8px}
.card{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.nm{font-weight:700;font-size:15px}
.meta{font-size:12px;color:var(--txt3);margin-top:2px}
.badge{flex:0 0 auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--blue-bg);color:var(--blue);white-space:nowrap;border:1px solid color-mix(in srgb,currentColor 22%,transparent)}
.badge.done{background:var(--green-bg);color:var(--green)}
.bar{display:flex;gap:3px;margin:10px 0 4px}
.bar span{flex:1;min-width:0;text-align:center}
.bar i{display:block;height:6px;border-radius:3px;background:var(--track)}
.bar .on i{background:var(--blue)}
.bar.done i{background:var(--green)}
.bar em{display:block;font-style:normal;font-size:10px;line-height:1.2;margin-top:4px;color:var(--txt3)}
.bar .on em{color:var(--txt2)}
.bar .cur em{color:var(--blue);font-weight:700}
.bar.done em{color:var(--txt2);font-weight:400}
.bar small{display:block;font-size:9px;line-height:1.2;color:var(--txt3);direction:ltr}
/* 🎨 (25/10/2026) שלב שהסתיים — ירוק · השלב הנוכחי — כחול · שלב עם חוסר פתוח — אדום (גם שלב עתידי) */
.bar .ok i{background:var(--green)}
.bar .ok em{color:var(--txt2)}
.bar .bad i{background:var(--red)}
.bar .bad em{color:var(--red);font-weight:700}
.short{font-size:12px;margin-top:4px;padding:5px 8px;border-radius:8px;background:var(--red-bg);color:var(--red)}
.short.res{background:none;color:var(--txt3);padding:2px 8px}
@media (max-width:420px){.bar{gap:2px}.bar em{font-size:9px}}
.pct{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:6px}
.pct b{display:block;height:100%;background:var(--blue)}
.stage{font-size:12px;color:var(--txt2)}
.msg{text-align:center;color:var(--txt3);padding:40px 10px;font-size:14px}
/* 📦 מלאי חומר האריזה (23/10/2026): במסך רחב — עמודה צרה משמאל לצד ההזמנות (נשארת גלויה בגלילה);
   בטלפון — למעלה, לפני ההזמנות. בלי מלאי הדף נשאר בעמודה אחת ברוחב הרגיל */
.wrap.wide{max-width:1000px}
/* 🔔 התראות Push (23/10/2026) */
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--txt2);background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:9px 12px;margin-bottom:12px}
.pbar.on{background:var(--green-bg);color:var(--green);border-color:transparent}
.pbar span{font-size:12px;color:var(--txt3)}
.pbar .pbtn{font-size:14px;font-weight:700;padding:8px 14px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.pbar .pbtn:disabled{opacity:.6}
.pbar #poff{background:none;border:0;color:inherit;text-decoration:underline;font:inherit;cursor:pointer;padding:0}
/* 📦 (02/11/2026) שורת חומר: שם בשורה מלאה, מתחת — במפעל / נדרש / חסר; פריט לפי מידה = טבלה אחת */
.stk{padding:7px 0;border-top:1px solid var(--brd)}
.stk-d+.stk{border-top:0}
.stk-d{font-size:12px;font-weight:700;color:var(--txt2);margin:10px 0 2px}
.stk-n{font-size:13px;font-weight:600}
.stk-q{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--txt3);margin-top:2px}
.stk-q b{color:var(--txt);font-size:14px}
.stk.bad .stk-n{color:var(--red)}
.stk-miss{color:var(--red);font-weight:700}
.stk-ok{color:var(--green)}
.stk-t{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.stk-t th{font-weight:400;color:var(--txt3);text-align:right;padding:2px 4px}
.stk-t td{padding:3px 4px;border-top:1px solid var(--brd)}
.stk-t tr.bad td{color:var(--red);font-weight:700}
.stk-sum{font-size:12px;font-weight:700;padding:6px 8px;border-radius:8px;margin-bottom:4px;background:var(--red-bg);color:var(--red)}
.stk-sum.ok{background:var(--green-bg);color:var(--green)}
/* 🖨 ריכוז חוסרים (11/11/2026) — רשימה בראש חלון המלאי + הדפסה (דף נקי: רק #stkpr) */
.stk-sh{display:flex;align-items:center;gap:8px}
.stk-sh button{margin-inline-start:auto;white-space:nowrap;flex:0 0 auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;border:0;background:var(--red);color:#fff;cursor:pointer}
.stk-sl{margin:6px 0 0;padding:0 18px 0 0;font-weight:400}
.stk-sl li{margin:2px 0}
.stk-sl b{font-weight:700}
.ord-sum{margin-bottom:12px;font-size:13px;padding:10px 12px}
/* .stkpdf = עיצוב הדף המודפס — גם ב-@media print (#stkpr) וגם בצילום ל-PDF באייפון */
.stkpdf{color:#000;background:#fff;font-size:13px;padding:12mm;direction:rtl}
.stkpdf h3{margin:0 0 2px;font-size:18px}.stkpdf .d{color:#555;margin-bottom:10px}
.stkpdf table{width:100%;border-collapse:collapse}.stkpdf th,.stkpdf td{border:1px solid #999;padding:5px 7px;text-align:right}
.stkpdf th{background:#eee}.stkpdf td.x{font-weight:700}
#stkpr{display:none}
@media print{body>*:not(#stkpr){display:none!important}#stkpr{display:block!important}
  body{background:#fff!important;margin:0!important}@page{margin:0}}
.lay.has-stk{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.lay.has-stk aside{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;overscroll-behavior:contain}
@media (max-width:760px){.lay.has-stk{display:flex;flex-direction:column;gap:0}.lay.has-stk aside{order:-1;position:static;max-height:none;overflow:visible}}
/* ✂️ דוח גזירה (08/11/2026): שורה בכרטיס ⇒ חלון עם הדוח (iframe) והדפסה */
.cutb{display:flex;align-items:center;width:100%;margin-top:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--brd);background:var(--blue-bg);color:var(--blue);font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-align:right}
.cutb span{margin-right:auto;font-size:16px}
.cutm{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:10px;z-index:50}
.cutm-b{background:var(--card);border-radius:14px;width:100%;max-width:900px;height:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.cutm-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--brd);font-size:14px}
.cutm-h button{font:inherit;font-size:14px;padding:6px 12px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--txt);cursor:pointer}
.cutm-h #cutp{background:var(--acc);color:#fff;border:0;font-weight:700}
.cutm-h #cutp:disabled{opacity:.5}
#cutc{flex:1;display:flex}
.cutf{flex:1;width:100%;border:0;background:#fff}
/* 🖼 תמונות (08/11/2026) */
.thumb{flex:0 0 auto;width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--brd);background:var(--track);cursor:zoom-in}
.sthumb{float:left;width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--brd);margin:0 0 4px 8px;cursor:zoom-in}
.stk::after{content:"";display:block;clear:both}
.imgm-b{max-width:95vw;max-height:92vh;text-align:center;color:#fff;font-size:14px}
.imgm-b img{display:block;max-width:95vw;max-height:85vh;border-radius:12px;margin:0 auto 8px;background:#fff}
footer{font-size:11px;color:var(--txt3);text-align:center;margin:20px 0 8px}
footer button{background:none;border:0;color:var(--blue);font:inherit;cursor:pointer;text-decoration:underline;padding:0}
.login{max-width:380px;margin:30px auto;text-align:center}
.login p{font-size:14px;color:var(--txt2);margin:0 0 14px}
.login input{width:100%;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--brd);background:var(--card);color:var(--txt);text-align:left}
.login button{width:100%;margin-top:10px;font-size:16px;font-weight:700;padding:12px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer}
.login button:hover:not(:disabled),.pbar .pbtn:hover:not(:disabled){background:var(--acc-h)}
.login input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
h1{color:var(--blue)}
.pbar{box-shadow:var(--sh)}
.login button:disabled{opacity:.6}
.login .err{color:#dc2626;font-size:13px;margin-top:8px;min-height:1em}
</style>
</head>
<body>
<div class="wrap">
  <header><span class="logo">✂️</span><div><h1 id="ttl">מעקב הזמנות</h1><div class="sub" id="sub"></div></div></header>
  <div id="pushbar"></div>
  <div id="app"><div class="msg">⏳ טוען…</div></div>
  <footer id="ft"></footer>
</div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import{getAuth,onAuthStateChanged,sendSignInLinkToEmail,isSignInWithEmailLink,signInWithEmailLink,signOut}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import{getMessaging,getToken,onMessage,isSupported}from'https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging.js';
// אותו פרויקט כמו index.html. ⚠️ **שם אפליקציה נפרד ('track') בכוונה:** ההתחברות נשמרת לפי שם האפליקציה,
// ובלעדיו כניסת לקוח באותו דפדפן הייתה דורסת את הכניסה של המנהל/עובד לאפליקציה (אותו origin)
const FB_CFG={apiKey:"AIzaSyCN9AlUZFX6tODyClzopC9BrRi-Oj7oSv8",projectId:"textileops-aef4a",appId:"1:570030273525:web:ff4a7d125a40066a4826bc",authDomain:"textileops-aef4a.firebaseapp.com",messagingSenderId:"570030273525"};
const app0=initializeApp(FB_CFG,'track');
const auth=getAuth(app0);auth.languageCode='he';
// 👁 תצוגת לקוח למנהל (22/10/2026): ?as=קוד לקוח, נפתח מחלון "פרטי לקוח". משתמש בכניסה של האפליקציה
// הראשית (שם האפליקציה 'txops3' כמו ב-initFb ב-index.html ⇒ אותה התחברות שמורה בדפדפן). השרת בודק role=manager
const AS=(new URLSearchParams(location.search).get('as')||'').trim();
const mAuth=AS?getAuth(initializeApp(FB_CFG,'txops3')):null;
// ✕ חזרה לאפליקציה (11/11/2026) — תצוגת מנהל: באייפון (אפליקציה במסך הבית) הדף נפתח באותו חלון בלי כפתור חזרה.
// סגירת לשונית (מחשב) ⇒ אחרת אחורה בהיסטוריה ⇒ אחרת דף האפליקציה
if(AS){const h=document.querySelector('header'),b=document.createElement('button');b.id='asx';b.textContent='✕ חזרה לאפליקציה';
  b.onclick=()=>{try{window.close();}catch(e){}setTimeout(()=>{if(history.length>1)history.back();else location.href='./';},300);};h?.appendChild(b);}
// ⚠️ השמות והסדר חייבים להתאים ל-TRACK_LISTS ב-functions/index.js (= PIPE_LISTS בלוח מצב הזמנות)
// השמות = עמודות "לוח מצב הזמנות" (22/10/2026), מוצגים בתג ומתחת לכל קטע בפס
const STAGES=['ההזמנה התקבלה','ספירה וגזירה','מוכן לתפירה','בתפירה','מוכן לאריזה','באריזה','מוכן ליציאה','יצא ללקוח'];
const URL_FN='https://us-central1-textileops-aef4a.cloudfunctions.net/customerTrack';
const PAGE=location.origin+location.pathname;
const LS_MAIL='trk_email';
// 📱 נפתח מאייקון במסך הבית. באייפון זו אפליקציה עם אחסון נפרד מ-Safari — לחיצה על הקישור במייל
// מתחברת ב-Safari ולא כאן ⇒ במצב הזה מציעים להדביק את הקישור (signInWithEmailLink מקבל אותו ישירות)
const STANDALONE=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const fmtD=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?m[3]+'/'+m[2]+'/'+m[1]:'';};
const fmtDM=d=>{const m=/^\d{4}-(\d{2})-(\d{2})/.exec(d||'');return m?m[2]+'/'+m[1]:'';}; // 📅 תאריך שלב בפס
const ls={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
// 📱 מזהה מכשיר (16/10/2026) — השרת מגביל מכשירים לכל מייל; מכשיר חדש מעל ההגבלה ממתין לאישור המפעל.
// localStorage בלבד: מחיקת נתוני הדפדפן (או ספארי אחרי 7 ימים בלי ביקור) = מכשיר חדש
const devId=()=>{let d=ls.get('trk_dev');if(!/^[A-Za-z0-9-]{8,64}$/.test(d)){d=crypto.randomUUID?crypto.randomUUID():(Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12));ls.set('trk_dev',d);}return d;};
const $=id=>document.getElementById(id);
const appEl=$('app'),ft=$('ft');
let busy=false,reauthMsg=false,pendT=0; // reauth = המייל הוסר והוסף מחדש ⇒ כל המכשירים נדרשים לקישור חדש

function card(o){
  const last=STAGES.length-1,done=o.stage===last;
  const pct=o.stage===3?o.sewPct:o.stage===5?o.packPct:null;
  const no=o.no?'הזמנה #'+String(o.no).padStart(3,'0')+' · ':'';
  // ✂️ פיצול: חלק באריזה והתפירה עוד לא הסתיימה ⇒ "מוכן לאריזה" לא מסומן, ושורת אחוז נוספת לתפירה
  const sp=!!o.split&&o.sewPct!=null;
  // ⚠ חוסרים (25/10/2026): פתוחים צובעים את השלב שלהם באדום; שלב שעבר — ירוק, הנוכחי — כחול
  const sh=Array.isArray(o.short)?o.short:[],openSt=new Set(sh.filter(x=>!x.res).map(x=>x.st));
  const segCls=i=>openSt.has(i)?'bad':!(i<=o.stage&&!(sp&&i===4))?'':(i<o.stage||done)?'ok':'on';
  const segs=STAGES.map((s,i)=>`<span class="${segCls(i)}${i===o.stage?' cur':''}"><i></i><em>${esc(s)}</em>${o.dates&&o.dates[i]?`<small>${esc(fmtDM(o.dates[i]))}</small>`:''}</span>`).join('');
  const dm=ms=>{const d=new Date(+ms);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');}; // תאריך מקומי
  const shHtml=sh.slice().sort((a,b)=>(!!a.res-!!b.res)||(b.at-a.at)).map(x=>x.res
    ?`<div class="short res">✓ ${esc(STAGES[x.st]||'')}: ${esc(x.txt)} · ${dm(x.at)} · נפתר ${dm(x.res)}</div>`
    :`<div class="short">⚠ חוסר · ${esc(STAGES[x.st]||'')}: ${esc(x.txt)} · ${dm(x.at)}</div>`).join('');
  return `<div class="card">
    <div class="top">${imgTag(o.img,o.iv,'thumb',o.name||('דגם '+o.prod))}<div style="flex:1;min-width:0"><div class="nm">${esc(o.name||('דגם '+o.prod))}</div>
      <div class="meta">${no}${o.qty?o.qty+" יח' · ":o.est?'~'+o.est+" יח' (משוער) · ":''}${done?'נשלח '+fmtD(o.ship):'התקבל '+fmtD(o.entry)}</div></div>
      <span class="badge ${done?'done':''}">${esc(STAGES[o.stage]||'')}${pct!=null?' '+pct+'%':''}</span></div>
    <div class="bar ${done?'done':''}">${segs}</div>
    <div class="stage">שלב ${o.stage+1} מתוך ${STAGES.length}</div>
    ${sp?`<div class="stage">בתפירה ${o.sewPct}%</div><div class="pct" title="${o.sewPct}%"><b style="width:${Math.max(0,Math.min(100,o.sewPct))}%"></b></div><div class="stage">באריזה ${pct??0}%</div>`:''}
    ${pct!=null?`<div class="pct" title="${pct}%"><b style="width:${Math.max(0,Math.min(100,pct))}%"></b></div>`:''}
    ${o.out>0?`<div class="stage">🚚 נשלחו ${o.out} יח' · השאר: ${esc(STAGES[o.stage]||'בייצור')}</div>`:''}
    ${shHtml}
    ${o.cut?`<button class="cutb" data-cut="${esc(o.cut)}" data-nm="${esc(o.name||('דגם '+o.prod))}">✂️ דוח גזירה <span>‹</span></button>`:''}
  </div>`;
}
// 🍎 הדפסה באייפון (11/11/2026): ב-PWA במסך הבית window.print() לא עושה כלום ⇒ צילום (html2canvas) ⇒ PDF (jsPDF)

const _ldJs=(src,ok,sri)=>ok()?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');if(sri){sc.integrity=sri;sc.crossOrigin='anonymous';}sc.src=src;sc.onload=res;sc.onerror=()=>rej(new Error('טעינה נכשלה'));document.head.appendChild(sc);});
const _pdfB={}; // PDF מוכן לכל כפתור (stkp = מלאי, ordp = הזמנות)
async function stkPdf(html,bid='stkp'){

  if(_stkBlob&&b?.dataset.ready){const f=new File([_stkBlob],(bid==='ordp'?'orders':'shortage')+'.pdf',{type:'application/pdf'});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return;}}catch(e){if(e?.name==='AbortError')return;}

    const el=document.createElement('div');el.className='stkpdf';el.style.cssText='position:fixed;left:-10000px;top:0;width:794px';el.innerHTML=html;document.body.appendChild(el);
    let cv;try{cv=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',windowWidth:794});}finally{el.remove();}
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),pagePx=Math.floor(cv.width*297/210);
    for(let y=0,pg=0;y<cv.height;y+=pagePx,pg++){const h=Math.min(pagePx,cv.height-y);if(pg&&h<pagePx*0.08)break;
      const c=document.createElement('canvas');c.width=cv.width;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,h);x.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
      if(pg)doc.addPage();doc.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',0,0,210,h*210/cv.width);}
    _stkBlob=_pdfB[bid]=doc.output('blob');

  }catch(e){if(b){b.disabled=false;b.textContent='🖨 הדפסה';}alert('הכנת ה-PDF נכשלה: '+(e?.message||e));}
}

const imgMem=new Map(),imgBusy=new Set();

    // 📋 (25/10/2026) נדרש להזמנות שלכם שבמפעל וכמה חסר — מהשרת (need); בלי need — כמו קודם

    // פריט לפי מידה (מפתח פריט|מידה) — טבלה אחת במקום שורה לכל מידה; למעלה — סיכום כמה חומרים כדאי לשלוח

        <span>במפעל <b style="${bad?'color:var(--red)':''}">${n}</b>${u}</span>${nd>0?`<span>נדרש ${r2(nd)}${u}</span>`:''}
        ${(qOf(s).nq>0||bad)?`<span class="stk-miss">⚠ ${qTxt(s,u,' · ')}${qOf(s).nq>0?' — כדאי לשלוח עוד':''}</span>`:nd>0?'<span class="stk-ok">✓ יש מספיק</span>':''}</div></div>`;};
    const stkSz=(name,l)=>{const u=unitOf(l[0]),hasNd=l.some(s=>Number(s.need)>0),bad=l.some(s=>stOf(s).bad);
      return `<div class="stk${bad?' bad':''}">${stkImg(l[0])}<div class="stk-n">${esc(name)}</div><table class="stk-t"><tr><th>מידה</th><th>במפעל</th>${hasNd?'<th>נדרש</th><th></th>':''}</tr>${l.map(s=>{const o=stOf(s);
        const qq=qOf(s);return `<tr${o.bad?' class="bad"':''}><td>${esc(s.sz)}</td><td>${o.n}${u}</td>${hasNd?`<td>${o.nd>0?r2(o.nd)+u:'—'}</td><td>${[qq.nq>0?'חסר '+r2(qq.nq):'',qq.mq>0?'מינ׳ +'+r2(qq.mq):''].filter(Boolean).join(' · ')||(o.bad?'⚠':o.nd>0?'<span class="stk-ok">✓</span>':'')}</td>`:''}</tr>`;}).join('')}</table></div>`;};
    const stkList=l=>{const out=[],grp={};l.forEach(s=>{const m=String(s.k||'').includes('|')&&/^(.*) · מידה (.*)$/.exec(s.name||'');
        if(!m){out.push(s);return;}const b=String(s.k).split('|')[0];if(!grp[b]){grp[b]={name:m[1],l:[]};out.push(grp[b]);}grp[b].l.push({...s,sz:m[2]});});
      return out.map(x=>x.l?stkSz(x.name,x.l):stkRow(x)).join('');};
    // 🖼 תמונת החומר (08/11/2026) — img = מועד; המזהה לפי הפריט (בלי מידה)
    const stkImg=s=>s.img&&s.imgId?imgTag(s.imgId,s.img,'sthumb',s.name):'';
    const nBad=new Set(stk.filter(s=>stOf(s).bad).map(s=>String(s.k||'').split('|')[0])).size; // מידות של אותו פריט = חומר אחד
    // 🖨 ריכוז חוסרים (11/11/2026): כל חומר שחסר — כמה לשלוח, בראש החלון + דף הדפסה. מתחת למינימום בלי "נדרש" ⇒ בלי כמות
    // כמות לשלוח = הגדול מבין: חסר לנדרש · חסר עד המינימום (min — מהשרת מ-11/11) · כמות שלילית
    const shortL=stk.filter(s=>stOf(s).bad).map(s=>{const{nd,n}=stOf(s),u=unitOf(s),{nq,mq,mn}=qOf(s);
      return{s,u,nd,n,mn,nq,mq,dept:DEPT[s.dept||'pack']||''};});
    const shortHtml='<ul class="stk-sl">'+shortL.map(x=>`<li>${esc(x.s.name)}: ${qTxt(x.s,x.u,' · ')}</li>`).join('')+'</ul>';
    const printShort=()=>{let p=$('stkpr');if(!p){p=document.createElement('div');p.id='stkpr';p.className='stkpdf';document.body.appendChild(p);}
      const nm=d.name||'',dt=new Date().toLocaleString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      p.innerHTML=`<h3>ריכוז חוסרים — חומרים לשלוח למפעל</h3><div class="d">${esc(nm)} · ${dt}</div><table><tr>${multi?'<th>מחלקה</th>':''}<th>חומר</th><th>במפעל</th><th>נדרש</th><th>חסר להזמנות</th><th>להשלמת מינימום</th></tr>`+
        shortL.map(x=>`<tr>${multi?'<td>'+esc(x.dept.replace(/^\S+\s/,''))+'</td>':''}<td>${esc(x.s.name)}</td><td><bdi dir="ltr">${x.n}</bdi>${x.u}</td><td>${x.nd>0?r2(x.nd)+x.u:'—'}</td><td class="x">${x.nq>0?r2(x.nq)+x.u:'—'}</td><td>${x.mq>0?'<b>'+r2(x.mq)+x.u+'</b> <small>(מינימום '+r2(x.mn)+x.u+')</small>':'—'}</td></tr>`).join('')+'</table>';
      if(IOS){stkPdf(p.innerHTML);return;} // 🍎 באייפון (אפליקציה במסך הבית) window.print לא עושה כלום
      window.print();};
    window._stkPrint=printShort;
    // ⚠ ריכוז חוסרים בהזמנות בייצור (11/11/2026) — החוסרים הפתוחים (o.short בלי res) מכל הכרטיסים, בראש הרשימה + הדפסה
    const fmtD=ms=>{const t=new Date(+ms);return String(t.getDate()).padStart(2,'0')+'/'+String(t.getMonth()+1).padStart(2,'0');};
    const oLbl=o=>(o.name||('דגם '+o.prod))+(o.no?' · הזמנה #'+String(o.no).padStart(3,'0'):'');
    const ordShort=act.flatMap(o=>(Array.isArray(o.short)?o.short:[]).filter(x=>!x.res).map(x=>({o,x}))).sort((a,b)=>a.x.at-b.x.at);
    const ordHtml=ordShort.length?`<div class="stk-sum ord-sum"><div class="stk-sh">⚠ ${ordShort.length===1?'חוסר אחד':ordShort.length+' חוסרים'} בהזמנות בייצור<button id="ordp">🖨 הדפסה</button></div><ul class="stk-sl">`+
      ordShort.map(({o,x})=>`<li><b>${esc(oLbl(o))}</b> — ${esc(STAGES[x.st]||'')}: ${esc(x.txt)} · ${fmtD(x.at)}</li>`).join('')+'</ul></div>':'';
    window._ordPrint=()=>{let p=$('stkpr');if(!p){p=document.createElement('div');p.id='stkpr';p.className='stkpdf';document.body.appendChild(p);}
      const dt=new Date().toLocaleString('he-IL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      p.innerHTML=`<h3>ריכוז חוסרים — הזמנות בייצור</h3><div class="d">${esc(d.name||'')} · ${dt}</div><table><tr><th>הזמנה</th><th>שלב</th><th>חוסר</th><th>מאז</th></tr>`+
        ordShort.map(({o,x})=>`<tr><td>${esc(oLbl(o))}</td><td>${esc(STAGES[x.st]||'')}</td><td class="x">${esc(x.txt)}</td><td>${fmtD(x.at)}</td></tr>`).join('')+'</table>';
      if(IOS){stkPdf(p.innerHTML,'ordp');return;}
      window.print();};
    const stkHtml=stk.length?`<h2>📦 החומרים שלכם במפעל</h2><div class="card">${nBad?`<div class="stk-sum"><div class="stk-sh">⚠ ${nBad===1?'חומר אחד':nBad+' חומרים'} — כדאי לשלוח עוד<button id="stkp">🖨 הדפסה</button></div>${shortHtml}</div>`:'<div class="stk-sum ok">✓ יש מספיק מכל החומרים</div>'}${multi
        ?Object.keys(DEPT).map(d=>{const l=stk.filter(s=>(s.dept||'pack')===d);return l.length?`<div class="stk-d">${DEPT[d]}</div>`+stkList(l):'';}).join('')
        :stkList(stk)}<div class="meta" style="margin-top:8px">מתעדכן אוטומטית עם כל משלוח שיוצא אליכם.</div></div>`:'';
    appEl.closest('.wrap')?.classList.toggle('wide',!!stk.length);
    appEl.innerHTML=`<div class="lay${stk.length?' has-stk':''}"><main>`+(!d.orders.length?'<div class="msg">אין כרגע הזמנות פעילות.</div>':
      (act.length?`<h2>🏭 בייצור (${act.length})</h2>`+ordHtml+act.map(card).join(''):'')+
      (shp.length?`<h2>✅ נשלחו ב-30 הימים האחרונים (${shp.length})</h2>`+shp.map(card).join(''):''))+
      `</main>${stk.length?'<aside>'+stkHtml+'</aside>':''}</div>`;
    const sp=$('stkp');if(sp)sp.onclick=()=>window._stkPrint&&window._stkPrint();
    const op=$('ordp');if(op)op.onclick=()=>window._ordPrint&&window._ordPrint();
    loadImgs();
    const t=new Date(d.at);
    const upd=' · עודכן '+t.toLocaleString('he-IL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
    if(AS){ft.innerHTML='👁 תצוגת מנהל — כך הלקוח רואה את הדף'+upd;return;}
    ft.innerHTML=esc(u.email)+upd+' · '+outBtn();
    bindOut();
    pushInit(); // 🔔 פעם אחת אחרי טעינה מוצלחת (pushSt שמור — לא קורא שוב לשרת בכל רענון)
  }catch(e){
    if(!appEl.querySelector('.card'))appEl.innerHTML='<div class="msg">⚠️ לא ניתן לטעון כרגע. נסו שוב בעוד רגע.</div>';
  }finally{busy=false;}
}

let confirmPending=false; // מכשיר אחר — מחכים שהלקוח יקליד את המייל; האזנת ה-auth לא תדרוס את הטופס
async function start(){
  if(AS){
    onAuthStateChanged(mAuth,u=>{
      if(u){appEl.innerHTML='<div class="msg">⏳ טוען…</div>';load();}
      else appEl.innerHTML='<div class="msg">🔒 תצוגת לקוח זמינה למנהל בלבד.<br>היכנסו לאפליקציה כמנהל ופתחו שוב מחלון "פרטי לקוח".</div>';
    });
    return;
  }
  if(isSignInWithEmailLink(auth,location.href)){
    appEl.innerHTML='<div class="msg">⏳ מתחבר…</div>';
    const em=ls.get(LS_MAIL);
    if(em)await finishLink(em);
    else{confirmPending=true;showLogin('לאישור הכניסה, הזינו שוב את כתובת המייל שאליה נשלח הקישור.',true);}
  }
  onAuthStateChanged(auth,u=>{
    if(u){confirmPending=false;appEl.innerHTML='<div class="msg">⏳ טוען…</div>';load();}
    else if(!confirmPending&&!appEl.querySelector('.login'))showLogin();
  });
}
// 🔄 גרסה חדשה של הדף (22/10/2026) — דף שנשאר פתוח (לשונית/אפליקציה במחשב) מרענן את עצמו לבד.
// טביעה מכותרות HEAD כמו _verFingerprint ב-index.html: בסיס נפרד לכל סוג טביעה (רפליקות CDN שונות
// מחזירות ETag או לא — השוואה בין סוגים = רענון שווא). לא בזמן טופס כניסה (המייל שהוקלד היה נמחק)
const verBase={};
async function checkVer(){
  try{
    const r=await fetch(location.pathname+'?v='+Date.now(),{method:'HEAD',cache:'no-store'});if(!r.ok)return;
    const et=(r.headers.get('etag')||'').replace(/^W\//,'').replace(/"/g,''),cl=r.headers.get('content-length');
    // ETag של Pages = "mtime-גודל"; כל דחיפה משנה mtime לכל הקבצים ⇒ משווים רק את הגודל (רענון רק כשהדף עצמו השתנה)
    const m=et.match(/^[0-9a-f]+-([0-9a-f]+)$/);
    const tag=m?{k:'et',v:parseInt(m[1],16)}:et?{k:'etx',v:et}:cl?{k:'cl',v:+cl}:null;if(!tag)return;
    if(!verBase[tag.k]){verBase[tag.k]=tag.v;return;}
    if(tag.v!==verBase[tag.k]&&!appEl.querySelector('.login'))location.reload();
  }catch(e){}
}
const tick=()=>{if(!document.hidden){load();checkVer();}};
start();checkVer();
// כל דקה (23/10/2026, היה 5) — רק כשהדף על המסך; ההזמנות עצמן שמורות בשרת 15 דק', המלאי מחושב בכל פעם
setInterval(tick,60000);
document.addEventListener('visibilitychange',tick);
</script>
